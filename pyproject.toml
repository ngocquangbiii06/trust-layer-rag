[project]
name = "trust-layer-rag"
version = "0.1.0"
description = "Vietnamese policy Q&A with claim-level verification, PII masking and an evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "qdrant-client>=1.12,<2",
    "fastembed>=0.4,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ingest = ["pypdf>=6,<7"]  # only for turning downloaded legal PDFs into text, not needed at runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
